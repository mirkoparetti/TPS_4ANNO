<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolatrice</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f4f6f8;
            display: grid;
            place-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .calcolatrice {
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            text-align: center;
            width: 240px;
        }
        h2 { margin: 0 0 16px; color: #334155; font-size: 1.2rem; }
        input {
            width: 65px;
            padding: 8px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: #6366f1; }
        .grid-bottoni {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 16px 0;
        }
        button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: #6366f1;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        button:hover { background: #4f46e5; }
        button:active { transform: scale(0.95); }
        h3 { margin: 0; color: #1e293b; font-size: 1.05rem; }
    </style>
</head>
<body>

    <div class="calcolatrice">
        <h2>Calcolatrice</h2>

        <input type="number" id="num1" placeholder="N1">
        <input type="number" id="num2" placeholder="N2">

        <div class="grid-bottoni">
            <button onclick="calcola('+')">+</button>
            <button onclick="calcola('-')">-</button>
            <button onclick="calcola('*')">×</button>
            <button onclick="calcola('/')">÷</button>
        </div>

        <h3 id="risultato">Risultato: 0</h3>
    </div>

    <script>
        function calcola(operazione) {
            var n1 = Number(document.getElementById("num1").value);
            var n2 = Number(document.getElementById("num2").value);
            var finale = 0;

            if (operazione == '+') finale = n1 + n2;
            if (operazione == '-') finale = n1 - n2;
            if (operazione == '*') finale = n1 * n2;
            if (operazione == '/') finale = (n2 == 0) ? "Errore (diviso 0)" : n1 / n2;

            document.getElementById("risultato").innerText = "Risultato: " + finale;
        }
    </script>

</body>
</html>
