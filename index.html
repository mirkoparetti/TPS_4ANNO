<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirko Paretti - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white font-sans flex flex-col min-h-screen justify-between p-6">

    <!-- Header / Navbar -->
    <header class="flex justify-between items-center w-full max-w-6xl mx-auto border-b border-gray-800 pb-4">
        <div class="font-mono text-lg font-bold">&lt;/&gt; Mirko Paretti</div>
        <!-- Collegamento inserito qui sotto nel tag href -->
        <a href="https://mirkoparetti.github.io/TPS_4ANNO/" target="_blank" class="bg-gray-800 hover:bg-gray-700 text-sm px-4 py-2 rounded-lg flex items-center gap-2 transition">
            <span>🐱</span> Repository GitHub
        </a>
    </header>

    <!-- Sezione Principale (Intro) -->
    <main class="flex-grow flex flex-col items-center justify-center text-center my-12 max-w-3xl mx-auto">
        <p class="text-gray-400 text-lg mb-6">

            <span class="text-white font-semibold">Tecnologie e Progettazione di Sistemi Informatici</span>.
        </p>
        
        <!-- Tag / Tecnologie -->
        <div class="flex flex-wrap justify-center gap-3">
            <span class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-3 py-1 rounded-full text-sm font-medium">🌐 HTML5</span>
            <span class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-3 py-1 rounded-full text-sm font-medium">🎨 CSS3</span>
            <span class="bg-yellow-600/20 text-yellow-400 border border-yellow-500/30 px-3 py-1 rounded-full text-sm font-medium">⚡ JavaScript ES6</span>
            <span class="bg-cyan-600/20 text-cyan-400 border border-cyan-500/30 px-3 py-1 rounded-full text-sm font-medium">🗂️ DOM Manipulation</span>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center text-xs text-gray-600 border-t border-gray-900 pt-4">
        © 2026 Mirko Paretti • Corso TPSIT 4° Anno
    </footer>

</body>
</html>
